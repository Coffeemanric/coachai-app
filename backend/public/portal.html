<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoachAI — Player Portal</title>
<style>
:root {
  --bg: #0a0c10;
  --surface: #111318;
  --surface2: #181c24;
  --surface3: #1e2330;
  --border: #242a38;
  --gold: #f5a623;
  --gold2: #d4700a;
  --red: #e53935;
  --green: #00c853;
  --text: #eceef5;
  --text2: #8b93aa;
  --muted: #4a5168;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── NAV ── */
nav {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.nav-logo {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 0.06em;
  background: linear-gradient(135deg, #f5a623, #d4700a);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.nav-badge {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--muted);
  text-transform: uppercase;
  margin-right: auto;
}
.nav-key-display {
  font-size: 12px;
  color: var(--text2);
  font-family: monospace;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 4px 10px;
  display: none;
}
.nav-key-display.visible { display: block; }

/* ── MAIN LAYOUT ── */
main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 32px 24px;
}

/* ── LOGIN SCREEN ── */
#loginScreen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 70vh;
  gap: 24px;
  text-align: center;
}
.login-icon { font-size: 64px; }
.login-title {
  font-size: 32px;
  font-weight: 800;
  background: linear-gradient(135deg, #f5a623, #d4700a);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.login-sub { font-size: 15px; color: var(--text2); max-width: 380px; line-height: 1.6; }
.login-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px;
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.login-label { font-size: 12px; font-weight: 600; color: var(--text2); letter-spacing: 0.08em; text-align: left; }
.login-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  color: var(--text);
  font-size: 16px;
  font-family: monospace;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  outline: none;
  transition: border-color 0.2s;
}
.login-input:focus { border-color: var(--gold); }
.login-btn {
  width: 100%;
  background: linear-gradient(135deg, #f5a623, #d4700a);
  color: #0a0c10;
  border: none;
  border-radius: 10px;
  padding: 14px;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  letter-spacing: 0.04em;
  transition: opacity 0.2s;
}
.login-btn:hover { opacity: 0.92; }
.login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.login-error {
  font-size: 13px;
  color: var(--red);
  text-align: center;
  display: none;
}
.login-error.visible { display: block; }

/* ── PORTAL CONTENT ── */
#portalContent { display: none; }
#portalContent.visible { display: block; }

/* ── STATS BAR ── */
.stats-bar {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 28px;
}
.stat-card {
  flex: 1;
  min-width: 140px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 20px;
}
.stat-num {
  font-size: 28px;
  font-weight: 800;
  color: var(--gold);
}
.stat-label { font-size: 12px; color: var(--text2); margin-top: 2px; }

/* ── SECTION HEADER ── */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.section-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
}
.section-count {
  font-size: 13px;
  color: var(--text2);
}

/* ── PLAYER GRID ── */
.player-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
  margin-bottom: 40px;
}
.player-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  transition: border-color 0.2s;
}
.player-card:hover { border-color: var(--gold); }

.player-card-header {
  padding: 18px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.player-avatar {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: linear-gradient(135deg, #f5a623, #d4700a);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 800;
  color: #0a0c10;
  flex-shrink: 0;
}
.player-info { flex: 1; min-width: 0; }
.player-name {
  font-size: 16px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.player-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
.player-sport-icons { font-size: 18px; }

.player-card-body { padding: 0 20px 20px; }

/* ── RADAR SVG ── */
.radar-wrap {
  display: flex;
  justify-content: center;
  padding: 8px 0;
}

/* ── SKILL PILLS ── */
.skill-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.skill-pill {
  font-size: 11px;
  font-weight: 600;
  border-radius: 20px;
  padding: 3px 10px;
  border: 1px solid;
}
.skill-pill.gA { color: #00c853; border-color: rgba(0,200,83,0.4); background: rgba(0,200,83,0.08); }
.skill-pill.gB { color: #f5a623; border-color: rgba(245,166,35,0.4); background: rgba(245,166,35,0.08); }
.skill-pill.gC { color: #ff9800; border-color: rgba(255,152,0,0.4);  background: rgba(255,152,0,0.08); }
.skill-pill.gD { color: #e53935; border-color: rgba(229,57,53,0.4);  background: rgba(229,57,53,0.08); }

/* ── ANALYSIS HISTORY ── */
.analysis-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.analysis-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
}
.analysis-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.analysis-icon { font-size: 16px; }
.analysis-title { font-size: 13px; font-weight: 600; }
.analysis-date { font-size: 11px; color: var(--text2); margin-left: auto; }
.analysis-summary { font-size: 12px; color: var(--text2); line-height: 1.5; }
.analysis-grades { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.grade-chip {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 12px;
}
.grade-chip.gA { color: #00c853; background: rgba(0,200,83,0.12); }
.grade-chip.gB { color: #f5a623; background: rgba(245,166,35,0.12); }
.grade-chip.gC { color: #ff9800; background: rgba(255,152,0,0.12); }
.grade-chip.gD { color: #e53935; background: rgba(229,57,53,0.12); }

/* ── TOGGLE ── */
.expand-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text2);
  cursor: pointer;
  margin-top: 14px;
  transition: all 0.15s;
}
.expand-btn:hover { border-color: var(--gold); color: var(--gold); }

/* ── NO DATA ── */
.empty-state {
  text-align: center;
  padding: 40px;
  color: var(--text2);
  font-size: 14px;
}
.empty-icon { font-size: 40px; margin-bottom: 10px; }

/* ── LICENSE INFO ── */
.license-bar {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 24px;
  font-size: 13px;
  color: var(--text2);
}
.license-bar .status-active { color: var(--green); font-weight: 700; }
.license-bar .status-owner  { color: var(--gold);  font-weight: 700; }

/* ── LOADING ── */
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin: 40px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-wrap { text-align: center; padding: 40px; }

/* ── FOOTER ── */
footer {
  text-align: center;
  padding: 32px 24px;
  color: var(--muted);
  font-size: 12px;
  border-top: 1px solid var(--border);
  margin-top: 40px;
}
footer a { color: var(--gold); text-decoration: none; }
</style>
</head>
<body>

<nav>
  <span class="nav-logo">CoachAI</span>
  <span class="nav-badge">Player Portal</span>
  <span class="nav-key-display" id="navKey"></span>
  <button onclick="logout()" id="logoutBtn" style="display:none;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer">Sign Out</button>
</nav>

<main>
  <!-- LOGIN SCREEN -->
  <div id="loginScreen">
    <div class="login-icon">🏆</div>
    <div class="login-title">CoachAI Player Portal</div>
    <div class="login-sub">Access your players' profiles, skill charts, and analysis history from any browser.</div>
    <div class="login-box">
      <div class="login-label">YOUR PRO LICENSE KEY</div>
      <input class="login-input" id="keyInput" type="text" placeholder="DC-PRO-XXXX-XXXX"
        maxlength="18" autocomplete="off" spellcheck="false"
        oninput="this.value = this.value.toUpperCase()"
        onkeydown="if(event.key==='Enter') doLogin()">
      <button class="login-btn" id="loginBtn" onclick="doLogin()">View My Players →</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <!-- PORTAL CONTENT -->
  <div id="portalContent">
    <div id="loadingWrap" class="loading-wrap">
      <div class="spinner"></div>
      <div style="color:var(--text2);font-size:14px;margin-top:12px">Loading profiles…</div>
    </div>
    <div id="portalInner" style="display:none"></div>
  </div>
</main>

<footer>
  CoachAI &mdash; AI Sports Coaching &nbsp;|&nbsp;
  <a href="index.html">Get CoachAI Pro</a>
</footer>

<script>
const API = ''; // same-origin — backend serves this file

let currentKey = '';
let portalData = null;

// ─── Auto-login from URL param or localStorage ────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const urlKey = params.get('key');
  const savedKey = localStorage.getItem('portal_key');
  if (urlKey) {
    document.getElementById('keyInput').value = urlKey.toUpperCase();
    doLogin();
  } else if (savedKey) {
    document.getElementById('keyInput').value = savedKey;
    doLogin();
  }
});

async function doLogin() {
  const keyVal = document.getElementById('keyInput').value.trim().toUpperCase();
  if (!keyVal) return;

  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  btn.disabled = true;
  btn.textContent = 'Loading…';
  err.classList.remove('visible');

  try {
    const r = await fetch(`${API}/portal/data?key=${encodeURIComponent(keyVal)}`);
    const data = await r.json();
    if (!r.ok || !data.ok) {
      throw new Error(data.error || 'Invalid key');
    }
    currentKey = keyVal;
    portalData = data;
    localStorage.setItem('portal_key', keyVal);

    // Update nav
    document.getElementById('navKey').textContent = keyVal;
    document.getElementById('navKey').classList.add('visible');
    document.getElementById('logoutBtn').style.display = 'block';

    showPortal(data);
  } catch (e) {
    err.textContent = e.message;
    err.classList.add('visible');
    btn.disabled = false;
    btn.textContent = 'View My Players →';
  }
}

function logout() {
  localStorage.removeItem('portal_key');
  currentKey = '';
  portalData = null;
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('portalContent').classList.remove('visible');
  document.getElementById('navKey').classList.remove('visible');
  document.getElementById('logoutBtn').style.display = 'none';
  document.getElementById('keyInput').value = '';
  document.getElementById('loginBtn').disabled = false;
  document.getElementById('loginBtn').textContent = 'View My Players →';
}

function showPortal(data) {
  document.getElementById('loginScreen').style.display = 'none';
  const content = document.getElementById('portalContent');
  content.classList.add('visible');
  document.getElementById('loadingWrap').style.display = 'block';
  document.getElementById('portalInner').style.display = 'none';

  setTimeout(() => {
    document.getElementById('loadingWrap').style.display = 'none';
    const inner = document.getElementById('portalInner');
    inner.innerHTML = buildPortalHTML(data);
    inner.style.display = 'block';
  }, 400);
}

// ─── GRADE helpers ────────────────────────────────────────────────────────────
const GRADE_VAL = { A: 4, B: 3, C: 2, D: 1 };
function gradeClass(g) { return g === 'A' ? 'gA' : g === 'B' ? 'gB' : g === 'C' ? 'gC' : 'gD'; }
function scoreToGrade(s) { return s >= 3.5 ? 'A' : s >= 2.5 ? 'B' : s >= 1.5 ? 'C' : 'D'; }

function computeSkills(playerId, analyses) {
  const pa = analyses.filter(a => a.playerId === playerId);
  const map = {};
  for (const a of pa) {
    for (const g of (a.grades || [])) {
      if (!map[g.area]) map[g.area] = { scores: [], sportIcon: a.sportIcon };
      map[g.area].scores.push(GRADE_VAL[g.grade] || 0);
    }
  }
  return Object.entries(map).map(([label, d]) => {
    const avg = d.scores.reduce((a,b)=>a+b,0) / d.scores.length;
    return { label, score: avg, grade: scoreToGrade(avg), sessions: d.scores.length, sportIcon: d.sportIcon };
  }).sort((a,b) => b.sessions - a.sessions || b.score - a.score);
}

// ─── Radar SVG (pure SVG, no canvas) ─────────────────────────────────────────
function drawRadar(skills) {
  if (!skills || skills.length < 3) return '';
  const N = skills.length, S = 180, cx = S/2, cy = S/2, r = S * 0.32;
  const ang = i => (Math.PI * 2 * i / N) - Math.PI / 2;
  const px  = (i, rr) => (cx + rr * Math.cos(ang(i))).toFixed(1);
  const py  = (i, rr) => (cy + rr * Math.sin(ang(i))).toFixed(1);

  let svg = `<svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}" style="overflow:visible">`;

  // Grid rings
  const ringColors = { 4:'rgba(0,200,83,0.12)', 3:'rgba(245,166,35,0.08)', 2:'rgba(255,152,0,0.07)', 1:'rgba(229,57,53,0.07)' };
  for (let lv = 4; lv >= 1; lv--) {
    const rr = r * (lv / 4);
    const pts = Array.from({length:N}, (_,i) => `${px(i,rr)},${py(i,rr)}`).join(' ');
    svg += `<polygon points="${pts}" fill="${ringColors[lv]}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>`;
  }
  // Axes
  for (let i = 0; i < N; i++) {
    svg += `<line x1="${cx}" y1="${cy}" x2="${px(i,r)}" y2="${py(i,r)}" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>`;
  }
  // Data polygon
  const datapts = skills.map((s,i) => `${px(i, r*(s.score/4))},${py(i, r*(s.score/4))}`).join(' ');
  svg += `<polygon points="${datapts}" fill="rgba(245,166,35,0.28)" stroke="#f5a623" stroke-width="1.5"/>`;
  // Dots + labels
  for (let i = 0; i < N; i++) {
    const s = skills[i];
    const dr = r * (s.score / 4);
    svg += `<circle cx="${px(i,dr)}" cy="${py(i,dr)}" r="3" fill="#f5a623"/>`;
    // Label
    const lr = r + 18;
    const lx = parseFloat(px(i, lr)), ly = parseFloat(py(i, lr));
    const anchor = lx < cx - 4 ? 'end' : lx > cx + 4 ? 'start' : 'middle';
    const gCol = s.grade==='A'?'#00c853':s.grade==='B'?'#f5a623':s.grade==='C'?'#ff9800':'#e53935';
    svg += `<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="9" fill="${gCol}" font-weight="700">${s.label.slice(0,10)}</text>`;
  }
  svg += '</svg>';
  return svg;
}

// ─── Build full portal HTML ───────────────────────────────────────────────────
const expandedCards = new Set();

function buildPortalHTML(data) {
  const { license, players = [], analyses = [], drills = [] } = data;
  const licenseStatus = license?.status || 'unknown';

  // License bar
  const licBar = `
    <div class="license-bar">
      <span>🔑 <strong style="color:var(--text)">${currentKey}</strong></span>
      ${license?.email ? `<span>📧 ${license.email}</span>` : ''}
      <span>Status: <span class="${licenseStatus === 'owner' ? 'status-owner' : 'status-active'}">${licenseStatus === 'owner' ? '👑 Owner' : '✅ Active'}</span></span>
      ${data.updatedAt ? `<span style="margin-left:auto;font-size:11px">Last sync: ${new Date(data.updatedAt).toLocaleString()}</span>` : ''}
    </div>`;

  // Stats bar
  const stats = `
    <div class="stats-bar">
      <div class="stat-card"><div class="stat-num">${players.length}</div><div class="stat-label">Players</div></div>
      <div class="stat-card"><div class="stat-num">${analyses.length}</div><div class="stat-label">Analyses</div></div>
      <div class="stat-card"><div class="stat-num">${drills.length}</div><div class="stat-label">Drills Logged</div></div>
      <div class="stat-card"><div class="stat-num">${[...new Set(analyses.map(a=>a.sport))].length}</div><div class="stat-label">Sports</div></div>
    </div>`;

  // Players
  const playerCards = players.length === 0
    ? `<div class="empty-state"><div class="empty-icon">👤</div>No players synced yet.<br>Add players in the CoachAI app and tap the ☁️ sync button.</div>`
    : `<div class="player-grid">${players.map(p => playerCard(p, analyses, drills)).join('')}</div>`;

  return licBar + stats + `
    <div class="section-header">
      <span class="section-title">🏆 Player Profiles</span>
      <span class="section-count">${players.length} player${players.length !== 1 ? 's' : ''}</span>
    </div>
    ${playerCards}
    <button onclick="refreshData()" style="background:var(--surface);border:1px solid var(--border);color:var(--text2);border-radius:10px;padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;display:block;margin:0 auto">🔄 Refresh Data</button>
  `;
}

function playerCard(p, analyses, drills) {
  const pa = analyses.filter(a => a.playerId === p.id);
  const pd = drills.filter(d => d.playerId === p.id);
  const skills = computeSkills(p.id, analyses);
  const expanded = expandedCards.has(p.id);

  const sports = [...new Set(pa.map(a => a.sportIcon))].join(' ');
  const initial = (p.name || '?')[0].toUpperCase();

  const strengthTop = skills.filter(s => s.grade === 'A' || s.grade === 'B').slice(0,3);
  const focusTop    = skills.filter(s => s.grade === 'C' || s.grade === 'D').slice(0,3);

  const pillsHTML = skills.slice(0,8).map(s =>
    `<span class="skill-pill ${gradeClass(s.grade)}">${s.sportIcon || ''} ${s.label} <strong>${s.grade}</strong></span>`
  ).join('');

  const radarSVG = drawRadar(skills.slice(0,7));

  const recentAnalyses = pa.slice(-3).reverse().map(a => `
    <div class="analysis-item">
      <div class="analysis-row">
        <span class="analysis-icon">${a.sportIcon || '🏅'}</span>
        <span class="analysis-title">${a.modLabel || a.mod}</span>
        <span class="analysis-date">${a.date || ''}</span>
      </div>
      <div class="analysis-summary">${(a.summary || '').slice(0,120)}${(a.summary||'').length > 120 ? '…' : ''}</div>
      <div class="analysis-grades">${(a.grades||[]).map(g =>
        `<span class="grade-chip ${gradeClass(g.grade)}">${g.area}: ${g.grade}</span>`
      ).join('')}</div>
    </div>
  `).join('');

  return `
    <div class="player-card" id="card_${p.id}">
      <div class="player-card-header">
        <div class="player-avatar">${initial}</div>
        <div class="player-info">
          <div class="player-name">${p.name}</div>
          <div class="player-meta">${p.sport ? `${p.sport}` : ''}${p.position ? ` · ${p.position}` : ''}${p.age ? ` · Age ${p.age}` : ''}</div>
        </div>
        <div class="player-sport-icons" title="Sports analyzed">${sports}</div>
      </div>
      <div class="player-card-body">
        ${skills.length > 0 ? `
          <div class="radar-wrap">${radarSVG}</div>
          <div class="skill-pills">${pillsHTML}</div>
          ${strengthTop.length ? `<div style="margin-top:10px;font-size:11px;color:var(--text2)">💪 <strong style="color:var(--green)">Strengths:</strong> ${strengthTop.map(s=>s.label).join(', ')}</div>` : ''}
          ${focusTop.length ?    `<div style="margin-top:4px;font-size:11px;color:var(--text2)">🎯 <strong style="color:var(--gold)">Focus areas:</strong> ${focusTop.map(s=>s.label).join(', ')}</div>` : ''}
        ` : `<div class="empty-state" style="padding:20px"><div class="empty-icon">📊</div>No analyses yet.</div>`}

        ${expanded && recentAnalyses ? `
          <div style="margin-top:14px">
            <div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:8px">RECENT SESSIONS (${pa.length} total · ${pd.length} drills)</div>
            <div class="analysis-list">${recentAnalyses}</div>
          </div>
        ` : ''}

        ${pa.length > 0 ? `
          <button class="expand-btn" onclick="toggleCard('${p.id}')">
            ${expanded ? '▲ Hide Details' : `▼ Show ${pa.length} Analyses`}
          </button>
        ` : ''}
      </div>
    </div>`;
}

function toggleCard(id) {
  if (expandedCards.has(id)) expandedCards.delete(id);
  else expandedCards.add(id);
  // Re-render just this card
  const card = document.getElementById('card_' + id);
  if (!card || !portalData) return;
  const { players = [], analyses = [], drills = [] } = portalData;
  const p = players.find(pl => pl.id === id);
  if (p) card.outerHTML = playerCard(p, analyses, drills);
}

async function refreshData() {
  if (!currentKey) return;
  try {
    const r = await fetch(`${API}/portal/data?key=${encodeURIComponent(currentKey)}`);
    const data = await r.json();
    if (data.ok) {
      portalData = data;
      document.getElementById('portalInner').innerHTML = buildPortalHTML(data);
    }
  } catch (e) {
    alert('Could not refresh: ' + e.message);
  }
}
</script>
</body>
</html>
