# Render.com deployment config — CoachAI Backend
# ─────────────────────────────────────────────────────────────────────────────
# 1. Go to https://dashboard.render.com → New → Web Service
# 2. Connect your GitHub repo: Coffeemanric/coachai-app
# 3. Render will auto-detect this file and pre-fill all settings
# 4. Add your secret environment variables in the Render dashboard
#    (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_PRICE_ID, SMTP_*, ADMIN_SECRET)
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: coachai-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free          # free tier: 512 MB RAM, spins down after 15 min idle
    # plan: starter     # $7/mo — always on, better for production
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000          # Render assigns its own port but this is the fallback

      # ── Add these as SECRET env vars in the Render dashboard ──────────────
      # STRIPE_SECRET_KEY         sk_live_...
      # STRIPE_WEBHOOK_SECRET     whsec_...
      # STRIPE_PRICE_ID           price_...
      # SMTP_HOST                 smtp.gmail.com
      # SMTP_PORT                 587
      # SMTP_USER                 you@gmail.com
      # SMTP_PASS                 your-app-password
      # EMAIL_FROM                CoachAI <noreply@gmail.com>
      # ADMIN_SECRET              some-random-string
      # FRONTEND_URL              https://coachai-backend.onrender.com
